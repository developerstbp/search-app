# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c764fc1a2819d17de0fb9f9c368412af"
name = "search app by tbp"
application_url = "https://skillful-indigo-loris-22.hostingersite.com/api/store"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/collections/create"
  topics = [ "collections/create" ]

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/products/create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/collections/delete"
  topics = [ "collections/delete" ]

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "https://skillful-indigo-loris-22.hostingersite.com/webhooks/collections/update"
  topics = [ "collections/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_products,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [
  "https://skillful-indigo-loris-22.hostingersite.com/api/store/auth/callback",
  "https://skillful-indigo-loris-22.hostingersite.com/api/store/auth/shopify/callback",
  "https://skillful-indigo-loris-22.hostingersite.com/api/store/api/auth/callback"
]

[app_proxy]
url = "https://skillful-indigo-loris-22.hostingersite.com/api/store/api"
subpath = "search-app"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"
